name: Publish Finance Atlas
on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - "config/**"
      - ".github/workflows/publish-atlas.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public tracker only
        uses: actions/checkout@v4
      - name: Synchronize approved status fields from private repo
        id: sync
        continue-on-error: true
        env:
          FINANCE_READ_TOKEN: ${{ secrets.FINANCE_READ_TOKEN }}
        run: python3 scripts/sync_finance_progress.py
      - name: Mark snapshot as stale if private sync fails
        if: steps.sync.outcome != 'success'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('site/progress.json')
          data = json.loads(path.read_text())
          data['connected'] = False
          data['verified_at'] = None
          data['note'] = 'GitHub sync unavailable. Feature catalog is published, but progress statuses are not verified. Check the publishing workflow and FINANCE_READ_TOKEN.'
          for item in data.get('packages', []):
              item['ci'] = 'unknown'
              item['review'] = 'unknown'
              item['deployment'] = 'unknown'
              item['pr_state'] = 'unknown'
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
      - name: Validate static public output
        run: |
          python3 -m json.tool site/progress.json >/dev/null
          test -s site/index.html
          if grep -Eiq '(github_pat_|ghp_[[:alnum:]]{20}|BEGIN PRIVATE KEY)' site/index.html site/progress.json; then
            echo 'Potential secret in output' >&2
            exit 1
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
