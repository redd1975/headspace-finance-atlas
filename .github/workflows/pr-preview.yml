name: Atlas synthetic PR preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: atlas-pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-preview:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
      ATLAS_PREVIEW_VERCEL_TOKEN: ${{ secrets.ATLAS_PREVIEW_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_HaKGbMxWDpkTL7SNcraQxOLB
      VERCEL_PROJECT_ID: prj_4nRhl8mkbDPCdzKQB171yQvIB80M
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test and build synthetic site
        run: |
          python3 -m unittest discover -s preview/tests -v
          python3 -m preview.build --pr "$PREVIEW_PR_NUMBER" --sha "$PREVIEW_SHA" --output dist/pr-preview
          python3 -m preview.verify --root dist/pr-preview --pr "$PREVIEW_PR_NUMBER" --sha "$PREVIEW_SHA"
          cat > dist/pr-preview/vercel.json <<'JSON'
          {
            "headers": [
              {
                "source": "/(.*)",
                "headers": [
                  {"key": "X-Robots-Tag", "value": "noindex, nofollow"},
                  {"key": "X-Content-Type-Options", "value": "nosniff"},
                  {"key": "Referrer-Policy", "value": "no-referrer"},
                  {"key": "Content-Security-Policy", "value": "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"}
                ]
              }
            ]
          }
          JSON
      - name: Deploy to allowlisted Vercel preview project (never production)
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATLAS_PREVIEW_VERCEL_TOKEN" || { echo "::error::Add repository secret ATLAS_PREVIEW_VERCEL_TOKEN before deployment"; exit 1; }
          export VERCEL_TOKEN="$ATLAS_PREVIEW_VERCEL_TOKEN"
          npm install --global vercel@latest
          mkdir -p dist/pr-preview/.vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > dist/pr-preview/.vercel/project.json
          pushd dist/pr-preview
          DEPLOY_URL="$(vercel deploy --yes --scope xpace1 --meta "atlasPreviewPr=$PREVIEW_PR_NUMBER" --meta "atlasPreviewSha=$PREVIEW_SHA")"
          popd
          case "$DEPLOY_URL" in https://*.vercel.app) ;; *) echo "::error::Unexpected deployment URL"; exit 1;; esac
          ALIAS="atlas-pr-${PREVIEW_PR_NUMBER}-headspace-atlas-pr-preview.vercel.app"
          vercel alias set "$DEPLOY_URL" "$ALIAS" --scope xpace1
          echo "url=https://$ALIAS" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
      - name: Verify public-safe preview actually works
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --max-time 15 -fsSL "$PREVIEW_URL/preview-manifest.json" -o "$RUNNER_TEMP/preview-manifest.json" &&
               curl --max-time 15 -fsSL "$PREVIEW_URL/progress.json" -o "$RUNNER_TEMP/progress.json" &&
               curl --max-time 15 -fsSL "$PREVIEW_URL/" -o "$RUNNER_TEMP/index.html"; then break; fi
            if [ "$attempt" -eq 12 ]; then echo "::error::Preview URL failed HTTP smoke checks"; exit 1; fi
            sleep 5
          done
          PREVIEW_ROOT="$RUNNER_TEMP" python3 - <<'PY'
          import os, pathlib
          from preview.verify import verify
          verify(pathlib.Path(os.environ["PREVIEW_ROOT"]), int(os.environ["PREVIEW_PR_NUMBER"]), os.environ["PREVIEW_SHA"])
          print("Live URL responds with expected PR/SHA and synthetic fixture")
          PY
      - name: Post or update persistent PR preview link
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.publish.outputs.url }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- atlas-synthetic-pr-preview -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const preview = process.env.PREVIEW_URL;
            const sha = process.env.PREVIEW_SHA;
            const body = `${marker}\n**Atlas Preview — READY**\n\n- **Preview URL:** ${preview}\n- **PR:** #${issue_number}\n- **Commit SHA:** \`${sha}\`\n- **Environment:** preview (not production)\n- **Data:** fictional/synthetic only; no real Finance records\n- **CI:** synthetic unit tests + HTML verification + live HTTP smoke passed\n- **Test accounts:** not applicable (public-safe static example)\n- **Known limitations:** no real Finance API, backend, authentication, or financial workflow\n- **Owner acceptance:** pending; comment here with changes requested.\n\nThis link remains the same after new commits.`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});

  cleanup:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_PR_NUMBER: ${{ github.event.pull_request.number }}
      ATLAS_PREVIEW_VERCEL_TOKEN: ${{ secrets.ATLAS_PREVIEW_VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_HaKGbMxWDpkTL7SNcraQxOLB
      VERCEL_PROJECT_ID: prj_4nRhl8mkbDPCdzKQB171yQvIB80M
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete PR-only alias and eligible preview deployments
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ATLAS_PREVIEW_VERCEL_TOKEN" || { echo "::error::Missing preview cleanup credential"; exit 1; }
          export VERCEL_TOKEN="$ATLAS_PREVIEW_VERCEL_TOKEN"
          npm install --global vercel@latest
          ALIAS="atlas-pr-${PREVIEW_PR_NUMBER}-headspace-atlas-pr-preview.vercel.app"
          if ! vercel alias rm "$ALIAS" --yes --scope xpace1 2>"$RUNNER_TEMP/alias-error.log"; then
            if ! grep -Eiq "not found|does not exist|no alias" "$RUNNER_TEMP/alias-error.log"; then
              echo "::error::Could not remove preview alias"; exit 1
            fi
          fi
          python3 -m preview.cleanup
      - name: Record preview removal on PR
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- atlas-synthetic-pr-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number, per_page: 100});
            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));
            const body = `${marker}\n**Atlas Preview — REMOVED**\n\nPR #${issue_number} closed. Its stable alias and tagged preview deployments were cleaned up. No production service or database was modified.`;
            if (existing) await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            else await github.rest.issues.createComment({owner, repo, issue_number, body});
